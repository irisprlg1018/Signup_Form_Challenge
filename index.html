<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor | Signup Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
   
    <main class="main_container">  
       <!--left side of the creen-->
       <div class="left_container">
    <h1>Learn to code by watching others</h1>
    <div class="intro_text">
    <p>
      See how experienced developers solve problems in real-time. 
    </br>Watching
      scripted tutorials is great, but understanding how developers think is
      invaluable.
    </p></div>
    </div>

    <!-- the right side of the screen-->
     <div class="right_container">
    <div class="trial_text"><strong>Try if free 7 days</strong> then $20/mo. thereafter</div>

    <form>
      <label>
        <input
          type="text"
          id="firstName"
          name="firstName" required
          placeholder="First Name"
        />
      </label>
    </br>
      <label>
        <input
          type="text"
          id="lastName"
          name="lastName" required
          placeholder="Last Name"
        />
      </label>
    </br>
    <label>
        <input
          type="email"
          id="emailAdd"
          name="emailAdd" required
          placeholder="Email Address"
        />
      </label>
    </br>
    <label>
        <input
          type="password"
          id="password"
          name="password" 
          placeholder="Password"
          required="required"
        />
      </label>
    
    <input id="button" type="submit" value="claim your free trial"/> 
   
  <p class="disclosure">By clicking the button, you are agreeing to our <b class="disclosure">Terms and Services</b></p>
   </form>
  </div>
  </main> 
  <script src="script.js"> </script>
  </body>
</html>
