<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor | Signup Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <p class="main-text">Learn to code by watching others</p>
      <p class="description">
        See how experienced developers solve problems in real-time. Watching
        scripted tutorials is great, but understanding how developers think is
        invaluable.
      </p>

      <div class="header-free-trial">
        <h3>Try it free 7 days then $20/mo. thereafter</h3>
      </div>

      <div class="form-container">
        <label for="firstName">First Name:</label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          placeholder="e.g., John"
        />

        <label for="lastName">Last Name:</label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          placeholder="e.g., Doe"
        />

        <label for="email">Email Address</label>
        <input
          type="email"
          id="emailAdd"
          name="email"
          placeholder="eg., email@mail.com"
        />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" />

        <div class="claim-btn">
          <button class="claim-btn">CLAIM YOUR FREE TRIAL</button>
        </div>

        <p>
          By clicking the button, you are agreeing to our Terms and Services
        </p>
      </div>
    </main>
  </body>
</html>
